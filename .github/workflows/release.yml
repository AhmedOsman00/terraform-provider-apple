# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - 'v*'

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@cb9bde2e2525e640591a934b1fd28eef1dcaf5e5 # v6.2.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      # The Terraform Registry shows the GitHub release body as the release
      # notes, and a list of commit subjects is not release notes. CHANGELOG.md
      # already holds a written section per version, so hand GoReleaser that
      # instead. Note that .goreleaser.yml must NOT disable the changelog: that
      # is the step which loads this file, and disabling it publishes an empty
      # body while every step still reports success.
      #
      # Fails when the tag has no matching section rather than releasing with
      # an empty body: a version is ingested once and cannot be re-released,
      # so silently shipping no notes is worse than not shipping.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            !found && $0 ~ "^## " v "([ (]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "CHANGELOG.md has no '## $version' section for tag $GITHUB_REF_NAME." >&2
            echo "Add one before tagging: it becomes the release notes on the Registry." >&2
            exit 1
          fi
          echo "Release notes ($(wc -l < "$RUNNER_TEMP/release-notes.md") lines):"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.1.0
        with:
          # Pinned to the v2 line: a future major could drop options this
          # configuration still uses, and a release is not the place to find out.
          version: '~> v2'
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
