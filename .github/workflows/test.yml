# Terraform Provider testing workflow.
name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'
  # Acceptance tests touch a real Apple Developer account, so allow running
  # them deliberately as well as on push.
  workflow_dispatch:

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure the project builds and is clean before running anything heavier.
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v ./...
      - name: Run linters
        # v9 of the action is required to read a golangci-lint v2 configuration.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  generate:
    name: Check Generated Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # `terraform fmt` in the generate job cannot catch configuration the provider
  # schema rejects, so validate every example directory against a locally built
  # provider. No credentials needed: validate never reaches the API.
  examples:
    name: Validate Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - run: go mod download
      - run: make validate-examples

  # Runs on every push and pull request, including from forks. No App Store
  # Connect credentials are provided, so the acceptance tests skip themselves
  # and only the credential-free tests execute.
  unit:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # terraform-plugin-testing drives a real Terraform binary even for
      # resource.UnitTest, so the provider schema tests need one available.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - run: go mod download
      - name: Run unit tests
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

  # Secrets cannot be referenced from a job-level `if`, so surface their
  # presence as an output instead. Forks and credential-less checkouts then
  # skip the acceptance job entirely rather than reporting a red build.
  check-credentials:
    name: Check for Credentials
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -n "$ISSUER_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "App Store Connect credentials are not configured; acceptance tests will be skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Acceptance tests create and destroy real resources in an Apple Developer
  # account. They run serially: the suite uses fixed identifiers, so parallel
  # matrix entries would collide with each other in the same team.
  #
  # TestAccDeviceResource* is excluded. Apple cannot delete a device, so those
  # two tests register their hardcoded UDIDs permanently: the first matrix entry
  # consumes the slots and every entry after it fails on the 409 the create maps
  # to "Device Already Exists". Running them is a deliberate, once-per-team act
  # -- see ACCEPTANCE_TESTING.md -- not something CI should do on every push.
  acceptance:
    name: Acceptance Tests (Terraform ${{ matrix.terraform }})
    needs: [build, check-credentials]
    if: needs.check-credentials.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        terraform:
          - '1.0.*'
          - '1.5.*'
          - '1.9.*'
          - 'latest'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_APP_STORE_CONNECT_API_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY }}
          APPLE_APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: go test ./internal/provider/ -v -timeout 30m -skip 'TestAccDeviceResource'
