# Terraform Provider testing workflow.
#
# Credential-free by construction: nothing here touches App Store Connect, so
# it runs identically on forks. The acceptance tests live in
# .github/workflows/acceptance.yml and are triggered by hand.
name: Tests

on:
  # Root-level markdown only: `*` does not match `/`, so a change under docs/
  # still runs the generate job that checks docs/ is in sync.
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  # Only on main: a branch push that also has a pull request open would
  # otherwise run this whole workflow twice for the same commit. GitHub
  # Actions does not support YAML anchors, hence the repeated list.
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

# Superseding a commit makes its in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ensure the project builds and is clean before running anything heavier.
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v ./...
      - name: Run linters
        # v9 of the action is required to read a golangci-lint v2 configuration.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  generate:
    name: Check Generated Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # `terraform fmt` in the generate job cannot catch configuration the provider
  # schema rejects, so validate every example directory against a locally built
  # provider. No credentials needed: validate never reaches the API.
  examples:
    name: Validate Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: go mod download
      - run: make validate-examples

  # Reachability-based: govulncheck reports a vulnerability only when a call
  # path from this module actually reaches the affected symbol, so a CVE deep in
  # a dependency the provider never calls does not fail the build.
  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # Pinned rather than @latest: the module carries its own `go` directive,
      # and a release that raises it past the version go.mod pins fails to
      # build here under GOTOOLCHAIN=local. v1.8.0 did exactly that, requiring
      # go 1.26 against this module's 1.25.8. Raise this together with go.mod.
      - name: Run govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # The acceptance tests in this package skip themselves without TF_ACC and
  # credentials, so this is the credential-free tier: httptest-backed client
  # tests, pure filter/model functions, and the provider schema tests.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # terraform-plugin-testing drives a real Terraform binary even for
      # resource.UnitTest, so the provider schema tests need one available.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: go mod download
      - name: Run unit tests
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out
      - name: Coverage summary
        # The profile was previously written and thrown away.
        run: |
          {
            echo '### Coverage'
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
