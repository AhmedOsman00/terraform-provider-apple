# The apple CLI's release workflow, on tags like cli-v0.1.0.
#
# The provider's release.yml triggers on v* and never sees these tags. Versions
# are the CLI's own: cli/CHANGELOG.md holds a section per version, and the
# GitHub release is never marked latest, so the repository keeps pointing at
# the provider.
name: CLI Release

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Version and release notes
        id: version
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$GITHUB_REF_NAME is not cli-vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          awk -v v="$version" '
            !found && $0 ~ "^## " v "([ (]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' cli/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "cli/CHANGELOG.md has no '## $version' section for tag $GITHUB_REF_NAME." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./internal/cli/... ./internal/apple/...

      # GoReleaser outside Pro reads its version from a plain semver tag, so it
      # is handed one and told not to publish: it builds the archives,
      # checksums and Homebrew cask into dist/, and the next step publishes
      # them under the real tag.
      - name: Build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean --config .goreleaser.cli.yml --skip=publish,validate
        env:
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}

      # On a re-run the release exists already. The archives are rebuilt, and
      # the cask carries their checksums, so they replace what is there.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          assets=(dist/apple_"$VERSION"_*.tar.gz dist/apple_"$VERSION"_checksums.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "apple CLI $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest=false
          fi

      # The tap's main branch only takes pull requests, so the cask goes in on
      # a branch and through a PR that merges itself. Committing through the
      # API attributes the change to the token's owner.
      - name: Homebrew cask
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAP: AhmedOsman00/homebrew-tap
        run: |
          cask=dist/homebrew/Casks/apple.rb
          if [ ! -s "$cask" ]; then
            echo "GoReleaser wrote no $cask." >&2
            exit 1
          fi

          # gh api prints the error body on a 404, so only its exit status
          # says whether the cask exists.
          file_sha=""
          current=""
          if meta=$(gh api "repos/$TAP/contents/Casks/apple.rb?ref=main" 2>/dev/null); then
            file_sha=$(jq -r .sha <<< "$meta")
            current=$(jq -r .content <<< "$meta" | base64 -d)
          fi
          if [ -n "$file_sha" ] && [ "$current" = "$(cat "$cask")" ]; then
            echo "The cask already describes $VERSION."
            exit 0
          fi

          branch="apple-$VERSION"
          main_sha=$(gh api "repos/$TAP/git/ref/heads/main" --jq .object.sha)
          gh api -X DELETE "repos/$TAP/git/refs/heads/$branch" >/dev/null 2>&1 || true
          gh api "repos/$TAP/git/refs" -f ref="refs/heads/$branch" -f sha="$main_sha" >/dev/null

          args=(-f message="apple $VERSION" -f content="$(base64 -w0 "$cask")" -f branch="$branch")
          if [ -n "$file_sha" ]; then
            args+=(-f sha="$file_sha")
          fi
          gh api -X PUT "repos/$TAP/contents/Casks/apple.rb" "${args[@]}" >/dev/null

          pr=$(gh pr create --repo "$TAP" --base main --head "$branch" \
            --title "apple $VERSION" \
            --body "The cask for [apple CLI $VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME).")
          gh pr merge "$pr" --repo "$TAP" --squash --delete-branch
          echo "Merged $pr."
