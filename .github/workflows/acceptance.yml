# Acceptance tests against a real Apple Developer account.
#
# Deliberately manual. These tests create and destroy billable resources in
# whichever team the APPLE_APP_STORE_CONNECT_* secrets belong to, they use
# fixed identifiers that collide if two runs overlap, and an interrupted run
# leaves material to clean up by hand (see ACCEPTANCE_TESTING.md). None of
# that belongs on a push trigger.
name: Acceptance Tests

on:
  workflow_dispatch:
    inputs:
      terraform_version:
        description: 'Terraform version to test against'
        type: choice
        default: 'latest'
        options:
          - 'latest'
          - '1.9.*'
          - '1.5.*'
          - '1.0.*'
      run_filter:
        description: 'go test -run pattern (default: every TestAcc*)'
        type: string
        default: 'TestAcc'
      include_device_tests:
        description: >-
          Include TestAccDeviceResource*. Registers two UDIDs PERMANENTLY --
          Apple cannot delete a device, so this passes once per team, ever.
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a run in progress: killing the job mid-apply skips Terraform's
# destroy and leaves resources behind at Apple. Queue instead.
concurrency:
  group: acceptance-tests
  cancel-in-progress: false

jobs:
  acceptance:
    name: Acceptance Tests (Terraform ${{ inputs.terraform_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Without credentials every acceptance test skips itself and the job goes
      # green having tested nothing, which is worse than a failure on a run
      # somebody triggered on purpose.
      - name: Require credentials
        env:
          ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY }}
          PRIVATE_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$ISSUER_ID" ]   || missing+=(APPLE_APP_STORE_CONNECT_ISSUER_ID)
          [ -n "$API_KEY" ]     || missing+=(APPLE_APP_STORE_CONNECT_API_KEY)
          [ -n "$PRIVATE_KEY" ] || missing+=(APPLE_APP_STORE_CONNECT_PRIVATE_KEY)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing repository secrets: ${missing[*]}" >&2
            echo "Acceptance tests would silently skip themselves. Refusing to run." >&2
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false
      - run: go mod download

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_APP_STORE_CONNECT_API_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY }}
          APPLE_APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_PRIVATE_KEY }}
          # Subscription tests hang off an App Store Connect app record, which
          # Apple's API cannot create. Without this they skip themselves; the
          # step below says so rather than letting it pass unnoticed.
          APPLE_TEST_APP_ID: ${{ secrets.APPLE_TEST_APP_ID }}
          RUN_FILTER: ${{ inputs.run_filter }}
          INCLUDE_DEVICE_TESTS: ${{ inputs.include_device_tests }}
        # No -parallel: the suite uses fixed identifiers that collide.
        run: |
          skip=(-skip 'TestAccDeviceResource')
          if [ "$INCLUDE_DEVICE_TESTS" = "true" ]; then
            skip=()
            echo "::warning::Device tests included -- the two hardcoded UDIDs are registered permanently."
          fi
          {
            echo "Terraform: ${{ inputs.terraform_version }}"
            echo "Filter:    -run '$RUN_FILTER' ${skip[*]}"
            if [ -z "$APPLE_TEST_APP_ID" ]; then
              echo "Subscriptions: SKIPPED (no APPLE_TEST_APP_ID secret)"
            else
              echo "Subscriptions: app $APPLE_TEST_APP_ID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$APPLE_TEST_APP_ID" ]; then
            echo "::warning::APPLE_TEST_APP_ID is not set -- every TestAccSubscription* test will skip itself."
          fi
          go test ./internal/provider/ -v -timeout 55m -run "$RUN_FILTER" "${skip[@]}"

      # A run killed mid-apply never reaches Terraform's destroy, and the
      # identifiers are fixed, so the leftovers block the next run too.
      - name: Leftover resource reminder
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          ### Check for leftovers

          A failed or timed-out run can leave a Bundle ID, Merchant ID, Pass
          Type ID, profile or unrevoked certificate in the portal, and a
          subscription group under the test app. See the cleanup list in
          `ACCEPTANCE_TESTING.md`.

          Subscription product identifiers are randomised per run, so a
          leftover subscription never blocks the next run -- but Apple reserves
          every identifier it has ever seen, so each run consumes a few
          permanently. That is expected and harmless.
          EOF
